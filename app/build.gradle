plugins {
    id 'com.android.application'
}

// 本地开发凭据 (2026-09-10): 真实服务器/账号/崩溃上报地址写在项目根 local.properties,
// 该文件已被 .gitignore 忽略、不会进版本库; 填了就编译进 APK (调试免手填),
// 不填则 JellyfinApiClient / CrashMonitor 回退到占位默认值 (公开仓库无真实凭据)。
// 模板见 local.properties.example。
// 远程升级 (2026-09-12): UPDATE_MANIFEST_URL 同理, 不填则 UpdateChecker 回退到线上默认清单。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def devServerUrl = localProps.getProperty('JELLYFIN_SERVER_URL', '')
def devUsername = localProps.getProperty('JELLYFIN_USERNAME', '')
def devPassword = localProps.getProperty('JELLYFIN_PASSWORD', '')
def devCrashEndpoint = localProps.getProperty('CRASH_ENDPOINT', '')
// 远程升级 (2026-09-12): 版本清单地址同样走 local.properties, 便于本地指向测试清单
def devUpdateManifestUrl = localProps.getProperty('UPDATE_MANIFEST_URL', '')

android {
    namespace 'com.ktools.zspacecarplayer'
    compileSdk 34

    buildFeatures {
        // AGP 8 起 BuildConfig 默认关闭, 凭据注入依赖它
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.ktools.zspacecarplayer"
        minSdk 18
        targetSdk 28
        versionCode 5
        versionName "3.1.1"

        buildConfigField "String", "JELLYFIN_SERVER_URL", "\"${devServerUrl}\""
        buildConfigField "String", "JELLYFIN_USERNAME", "\"${devUsername}\""
        buildConfigField "String", "JELLYFIN_PASSWORD", "\"${devPassword}\""
        buildConfigField "String", "CRASH_ENDPOINT", "\"${devCrashEndpoint}\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${devUpdateManifestUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    ndkVersion "21.4.7075529"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        // 允许 JVM 单测中 android.jar 桩方法返回默认值 (如 Handler.post)
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    // Android 4.3 兼容网络库 (OkHttp 3.12.13 是最后一个支持 minSdk 9/18 的版本)
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Glide 图片加载
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
